name: Build and deploy GeoAI Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install small Python geospatial toolchain
        run: pip install -r requirements.txt
      - name: Verify Python geospatial code
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Automatically obtain real Berlin GIS data
        run: python scripts/fetch_berlin.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm install --no-audit --no-fund
      - name: Verify frontend geospatial and visual-search logic
        run: npm run test:geo
      - name: Build website
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
