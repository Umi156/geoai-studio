name: Check proposed changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install GIS packages
        run: pip install -r requirements.txt
      - name: Offline Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI packages
        run: npm install --no-audit --no-fund
      - name: AOI tests
        run: npm run test:geo
      - name: TypeScript and production build
        run: npm run build
